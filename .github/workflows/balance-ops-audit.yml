name: Balance ops audit (3h)

on:
  schedule:
  # UTC every 3 hours — KST +9
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  balance-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Run balance ops audit
        run: npm run audit:balance-ops
        continue-on-error: true

      - name: Commit audit timeline if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/balance-ops-audit/reports/
          if git diff --cached --quiet; then
            echo "No audit output changes"
            exit 0
          fi
          STAMP=$(TZ=Asia/Seoul date +%Y-%m-%d-%H%M)
          git commit -m "chore(audit): balance ops snapshot ${STAMP} (KST)"
          git push
