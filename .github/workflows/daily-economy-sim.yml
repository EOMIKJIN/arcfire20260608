# Macro economy SIM — ArcCore overlay delta 산출
#
# 2026-06-18: schedule cron 폐지 — GitHub 실패 알림 메일 스팸 방지.
#   - 정본: 로컬 `npm run sim:economy` · 김경제 handoff · 일일 배치 ingest
#   - CI 자동 실행·커밋 비활성 — 필요 시 Actions에서 수동 실행만
#
# 수동 실행: Actions → Daily economy sim → Run workflow

name: Daily economy sim

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  economy-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Verify macro cohort order
        run: npm run verify:economy-sim-cohort

      - name: Run macro economy sim
        run: npm run sim:economy

      - name: Commit sim outputs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/balance/generated/economySimOverlayDelta.ts
          git add tools/economy-sim/outbox/
          git add tools/economy-sim/reports/
          if git diff --cached --quiet; then
            echo "No sim output changes"
            exit 0
          fi
          DAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git commit -m "chore(sim): economy overlay delta ${DAY} (KST)"
          git push
